name: Feature request
description: Suggest a new feature or improvement for Actinium
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you're trying to solve, not just the feature you have in mind. It helps find the best solution.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you're trying to do and what's getting in the way.
      placeholder: I'm trying to... but the engine currently...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the engine to do? API sketches or example code are welcome.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: How might this look in user code?
      render: rust

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried or thought about.

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - All platforms

  - type: dropdown
    id: contribute
    attributes:
      label: Would you be willing to help implement this?
      options:
        - "Yes, I'd like to submit a PR"
        - "Maybe, with guidance"
        - "No, I'm just suggesting it"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links to other engines' implementations, related issues, mockups, etc.
      placeholder: Any additional context or information that might be helpful.